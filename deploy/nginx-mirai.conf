# /etc/nginx/sites-available/mirai  – serves the React build and proxies /api to FastAPI.
# Replace app.your-domain.in, then: certbot --nginx -d app.your-domain.in
server {
    listen 80;
    server_name app.your-domain.in;

    root /opt/mirai-shakthi/frontend/dist;
    index index.html;

    # Sprint 5 – faster on slow mobile data: compress text and cache files whose names change on every build.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        add_header Cache-Control "no-cache";  # always check for a new index.html after a deploy
        try_files $uri /index.html;
    }

    client_max_body_size 10m;
}
